[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotreach"
dynamic = ["version"]
description = "Typed, zero-dependency get/set/delete/has, flatten, glob and a CLI for nested dicts and lists by dotted path"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Javier Lianes", email = "javier@lianes8studio.com" }]
keywords = ["dict", "nested", "dotted-path", "getset", "deep-get", "json", "path", "typed", "flatten", "glob", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
dotreach = "dotreach._cli:main"

[project.optional-dependencies]
dev = ["ruff", "mypy", "pytest", "build", "twine"]

[project.urls]
Homepage = "https://lianes8studio.com"
Source = "https://github.com/JaviLianes8/dotreach"
Issues = "https://github.com/JaviLianes8/dotreach/issues"
Changelog = "https://github.com/JaviLianes8/dotreach/blob/main/CHANGELOG.md"
LinkedIn = "https://www.linkedin.com/in/jlianes/"
Funding = "https://buymeacoffee.com/jlianesglrs"

[tool.hatch.version]
path = "src/dotreach/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dotreach"]

[tool.hatch.build.targets.sdist]
include = [
    "src/dotreach",
    "tests/*.py",
    "tests/upstream/MANIFEST.json",
    "scripts/fetch_upstream.py",
    "README.md",
    "GUIDE.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "requirements-dev.txt",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
pythonpath = ["src"]
addopts = "-q --doctest-modules"
